<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1321">
  <title>Para ti</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #f3f5fa;
      background: radial-gradient(ellipse at 50% 25%, #203450, #0b1321 72%);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px 18px;
      text-align: center;
    }

    h1 {
      max-width: 24ch;
      margin: 0;
      font-size: clamp(1.65rem, 5vw, 2.8rem);
      font-weight: 400;
      line-height: 1.18;
      text-wrap: balance;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, 480px);
      max-height: 66vh;
      max-height: 66svh;
      border-radius: 8px;
      box-shadow: 0 14px 42px #0005;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hoy se acostumbra regalar tiaras y esta es para ti.</h1>
    <img
      src="./img/file_0000000085a8820ebefc9788720b5c88.png"
      alt="Selfie con tiara plateada, lentes y una lata de Fanta de uva">
  </main>
</body>
</html>
